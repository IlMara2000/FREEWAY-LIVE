  <path d="M152 386L366 126" stroke="url(#road)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M214 314L274 244" stroke="#01030b" stroke-width="9" stroke-linecap="round" stroke-dasharray="26 20" opacity="0.82"/>

