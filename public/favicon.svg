<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Freeway Life">
  <defs>
    <linearGradient id="bg" x1="64" y1="36" x2="448" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2130"/>
      <stop offset="0.48" stop-color="#02050c"/>
      <stop offset="1" stop-color="#04141d"/>
    </linearGradient>
    <linearGradient id="lane" x1="120" y1="420" x2="404" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.36" stop-color="#34d399"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="128" fill="url(#bg)" filter="url(#soft)"/>
  <rect x="47" y="47" width="418" height="418" rx="116" fill="none" stroke="#67e8f9" stroke-opacity="0.34" stroke-width="9"/>
  <path d="M142 408L248 114" stroke="url(#lane)" stroke-width="56" stroke-linecap="round" opacity="0.92" filter="url(#glow)"/>
  <path d="M300 408L406 114" stroke="url(#lane)" stroke-width="56" stroke-linecap="round" opacity="0.62" filter="url(#glow)"/>
  <path d="M204 316L330 158" stroke="#02050c" stroke-width="15" stroke-linecap="round" stroke-dasharray="40 30" opacity="0.88"/>

  <path d="M136 172H344" stroke="#f8fafc" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M136 172V362" stroke="#f8fafc" stroke-width="52" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M142 268H280" stroke="#f8fafc" stroke-width="44" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="392" cy="128" r="31" fill="#a7f3d0" filter="url(#glow)"/>
  <circle cx="392" cy="128" r="12" fill="#02050c" opacity="0.42"/>
</svg>
