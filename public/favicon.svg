      <stop offset="0" stop-color="#07101a"/>
      <stop offset="0.52" stop-color="#01030b"/>
      <stop offset="1" stop-color="#020816"/>
    </linearGradient>
    <linearGradient id="road" x1="132" y1="402" x2="392" y2="102" gradientUnits="userSpaceOnUse">
