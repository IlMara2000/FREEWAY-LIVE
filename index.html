<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#01030b" />
    <title>Freeway-Life | Focus Hub</title>
    <meta name="description" content="Il tuo quartier generale operativo. Potenzia il focus con gamification e design cyberpunk." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #02050c;
      }

      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ecfeff;
        text-align: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 36%, rgba(45, 212, 191, 0.18), transparent 24rem),
          linear-gradient(180deg, #02050c 0%, #061827 100%);
      }

      .boot-fallback__mark {
        width: 80px;
        height: 80px;
        display: grid;
        place-items: center;
        margin: 0 auto 28px;
        border: 1px solid rgba(103, 232, 249, 0.28);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.24);
        box-shadow: 0 0 48px rgba(45, 212, 191, 0.28);
        color: #5eead4;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .boot-fallback__title {
        margin: 0;
        font-size: clamp(42px, 9vw, 86px);
        line-height: 0.9;
        letter-spacing: 0.08em;
        font-weight: 900;
        text-shadow: 0 0 28px rgba(125, 211, 252, 0.48);
      }

      .boot-fallback__subtitle,
      .boot-fallback__hint {
        margin: 10px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .boot-fallback__subtitle {
        color: rgba(94, 234, 212, 0.82);
        font-size: 13px;
      }

      .boot-fallback__hint {
        margin-top: 38px;
        color: rgba(207, 250, 254, 0.58);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" aria-label="Freeway Life">
        <div>
          <div class="boot-fallback__mark">FWL</div>
          <h1 class="boot-fallback__title">FREEWAY</h1>
          <p class="boot-fallback__subtitle">LIFE</p>
          <p class="boot-fallback__hint">TOCCA PER ENTRARE</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
