<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef0f2" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="TraduLimba traduce tra italiano e sardo, con LSC, campidanese e logudorese." />
    <meta property="og:title" content="TraduLimba — Il sardo, in tutte le sue voci" />
    <meta property="og:description" content="Traduci tra italiano e sardo scegliendo la varietà più vicina a te." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>TraduLimba — Traduttore italiano sardo</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #eef0f2; }
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; color: #17384b; font-family: system-ui, sans-serif; }
      .boot-fallback div { text-align: center; }
      .boot-fallback img { width: 64px; height: 64px; }
      .boot-fallback strong { display: block; margin-top: 14px; font-size: 22px; }
      .boot-fallback span { display: block; margin-top: 5px; color: #5d6b74; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" aria-label="Caricamento di TraduLimba">
        <div>
          <img src="/favicon.svg" alt="" />
          <strong>TraduLimba</strong>
          <span>Prepariamo il traduttore…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
