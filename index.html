<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#01030b" />
    <title>Freeway-Life | Focus Hub</title>
    <meta name="description" content="Il tuo quartier generale operativo. Potenzia il focus con gamification e design cyberpunk." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #02050c;
      }

      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ecfeff;
        text-align: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 36%, rgba(45, 212, 191, 0.18), transparent 24rem),
          linear-gradient(180deg, #02050c 0%, #061827 100%);
      }

      .boot-fallback__mark {
        width: 80px;
        height: 80px;
        display: grid;
        place-items: center;
        margin: 0 auto 28px;
        filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.34));
      }

      .boot-fallback__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .boot-fallback__title {
        margin: 0;
        font-size: clamp(42px, 9vw, 86px);
        line-height: 0.9;
        letter-spacing: 0.08em;
        font-weight: 900;
        text-shadow: 0 0 28px rgba(125, 211, 252, 0.48);
      }

      .boot-fallback__subtitle,
      .boot-fallback__hint {
        margin: 10px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .boot-fallback__subtitle {
        color: rgba(94, 234, 212, 0.82);
        font-size: 13px;
      }

      .boot-fallback__hint {
        margin-top: 38px;
        color: rgba(207, 250, 254, 0.58);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" aria-label="Freeway Life">
        <div>
          <div class="boot-fallback__mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <defs>
                <linearGradient id="boot-surface" x1="8" y1="4" x2="58" y2="61" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#13263a" />
                  <stop offset="0.48" stop-color="#02050c" />
                  <stop offset="1" stop-color="#001b18" />
                </linearGradient>
                <linearGradient id="boot-rim" x1="10" y1="6" x2="55" y2="58" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#f8fafc" stop-opacity="0.7" />
                  <stop offset="0.42" stop-color="#22d3ee" stop-opacity="0.38" />
                  <stop offset="1" stop-color="#34d399" stop-opacity="0.62" />
                </linearGradient>
                <linearGradient id="boot-route" x1="12" y1="51" x2="54" y2="11" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#ff914d" />
                  <stop offset="0.42" stop-color="#34d399" />
                  <stop offset="1" stop-color="#67e8f9" />
                </linearGradient>
                <radialGradient id="boot-spark" cx="0" cy="0" r="1" gradientTransform="matrix(23 -26 26 23 45 14)" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ecfeff" />
                  <stop offset="0.42" stop-color="#67e8f9" stop-opacity="0.55" />
                  <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
                </radialGradient>
                <filter id="boot-depth" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
                </filter>
                <filter id="boot-glow" x="-45%" y="-45%" width="190%" height="190%">
                  <feGaussianBlur stdDeviation="2.4" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <clipPath id="boot-clip">
                  <rect x="5" y="5" width="54" height="54" rx="17" />
                </clipPath>
                <mask id="boot-road-mask">
                  <rect width="64" height="64" fill="black" />
                  <path d="M18.8 50.2V21.4c0-5 4-9 9-9h20.6c2.8 0 5 2.2 5 5s-2.2 5-5 5H30.6c-1.2 0-2.1 0.9-2.1 2.1v5.6h15c2.7 0 4.8 2.1 4.8 4.8s-2.1 4.8-4.8 4.8h-15v10.5c0 2.7-2.2 5-4.9 5s-4.8-2.3-4.8-5Z" fill="white" />
                </mask>
              </defs>
              <rect x="5" y="5" width="54" height="54" rx="17" fill="url(#boot-surface)" />
              <g clip-path="url(#boot-clip)">
                <circle cx="46" cy="14" r="23" fill="url(#boot-spark)" opacity="0.85" />
                <path d="M-2 49C16 41 30 47 66 29" stroke="#34d399" stroke-width="9" stroke-opacity="0.08" />
                <path d="M10 63C23 47 38 39 59 37" stroke="#67e8f9" stroke-width="4" stroke-opacity="0.12" />
              </g>
              <rect x="6.5" y="6.5" width="51" height="51" rx="15.5" fill="none" stroke="url(#boot-rim)" stroke-width="1.4" />
              <path d="M18.8 50.2V21.4c0-5 4-9 9-9h20.6c2.8 0 5 2.2 5 5s-2.2 5-5 5H30.6c-1.2 0-2.1 0.9-2.1 2.1v5.6h15c2.7 0 4.8 2.1 4.8 4.8s-2.1 4.8-4.8 4.8h-15v10.5c0 2.7-2.2 5-4.9 5s-4.8-2.3-4.8-5Z" fill="#f8feff" filter="url(#boot-depth)" />
              <path d="M14 48C24.5 46 33.8 39.8 39.6 30.2C44.9 21.4 49 16.4 55 14" stroke="url(#boot-route)" stroke-width="4.4" stroke-linecap="round" filter="url(#boot-glow)" />
              <path d="M16 48.4C27.4 43 35.2 35.6 40.4 23.4" stroke="#02050c" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="4.5 4.5" opacity="0.78" mask="url(#boot-road-mask)" />
              <path d="M49.2 12.4L55 14L51.7 19" fill="none" stroke="#ecfeff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="13" cy="51" r="2.2" fill="#ff914d" />
            </svg>
          </div>
          <h1 class="boot-fallback__title">FREEWAY</h1>
          <p class="boot-fallback__subtitle">LIFE</p>
          <p class="boot-fallback__hint">TOCCA PER ENTRARE</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
